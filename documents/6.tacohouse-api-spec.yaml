openapi: 3.0.3
info:
  title: Tacohouse - Rental Room Management System API
  description: |
    A comprehensive rental room management system API for managing buildings, rooms, tenants, billing, and payments.
    
    ## Response Format
    All responses follow a standardized format:
    - **status**: HTTP status code
    - **message**: Human-readable message
    - **data**: Response data (object or array)
    - **pagination**: (Optional) Pagination metadata for list endpoints
  version: 1.0.0

servers:
  - url: http://localhost:3001/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== ENUMS ====================
    UserRole:
      type: string
      enum: [ADMIN, LANDLORD, TENANT]

    RoomStatus:
      type: string
      enum: [AVAILABLE, OCCUPIED, MAINTENANCE, RESERVED]

    BillStatus:
      type: string
      enum: [PENDING, PAID, OVERDUE, CANCELLED]

    PaymentStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, REFUNDED]

    PaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER, E_WALLET, CREDIT_CARD]

    RentalStatus:
      type: string
      enum: [ACTIVE, PENDING, EXPIRED, TERMINATED]

    # ==================== STANDARD RESPONSES ====================
    SuccessResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Bad Request"
        error:
          type: string
          example: "Validation failed"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    # ==================== USER SCHEMAS ====================
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatar:
          type: string
        dateOfBirth:
          type: string
          format: date
        occupation:
          type: string
        workplace:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserProfileDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatar:
          type: string
        dateOfBirth:
          type: string
          format: date
        occupation:
          type: string
        workplace:
          type: string

    ChangePasswordDto:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)'
        confirmPassword:
          type: string

    # ==================== BUILDING SCHEMAS ====================
    Building:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        description:
          type: string
        landlordId:
          type: string
        totalRooms:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBuildingDto:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
        description:
          type: string

    UpdateBuildingDto:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        description:
          type: string

    # ==================== ROOM SCHEMAS ====================
    Room:
      type: object
      properties:
        id:
          type: string
        roomNumber:
          type: string
        floor:
          type: integer
        area:
          type: number
        price:
          type: number
        deposit:
          type: number
        status:
          $ref: '#/components/schemas/RoomStatus'
        buildingId:
          type: string
        description:
          type: string
        maxOccupants:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRoomDto:
      type: object
      required: [roomNumber, floor, area, price, deposit, buildingId]
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
        area:
          type: number
        price:
          type: number
        deposit:
          type: number
        buildingId:
          type: string
        description:
          type: string
        maxOccupants:
          type: integer

    UpdateRoomDto:
      type: object
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
        area:
          type: number
        price:
          type: number
        deposit:
          type: number
        status:
          $ref: '#/components/schemas/RoomStatus'
        description:
          type: string
        maxOccupants:
          type: integer

    # ==================== RENTAL SCHEMAS ====================
    Rental:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        tenantId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        monthlyRent:
          type: number
        deposit:
          type: number
        status:
          $ref: '#/components/schemas/RentalStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRentalDto:
      type: object
      required: [roomId, tenantId, startDate, monthlyRent, deposit]
      properties:
        roomId:
          type: string
        tenantId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        monthlyRent:
          type: number
        deposit:
          type: number

    UpdateRentalDto:
      type: object
      properties:
        endDate:
          type: string
          format: date
        monthlyRent:
          type: number
        status:
          $ref: '#/components/schemas/RentalStatus'

    # ==================== BILL SCHEMAS ====================
    Bill:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        rentalId:
          type: string
        billingPeriodStart:
          type: string
          format: date
        billingPeriodEnd:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        totalAmount:
          type: number
        status:
          $ref: '#/components/schemas/BillStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillItem:
      type: object
      properties:
        id:
          type: string
        billId:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        amount:
          type: number

    CreateBillDto:
      type: object
      required: [roomId, rentalId, billingPeriodStart, billingPeriodEnd, dueDate, items]
      properties:
        roomId:
          type: string
        rentalId:
          type: string
        billingPeriodStart:
          type: string
          format: date
        billingPeriodEnd:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number

    UpdateBillDto:
      type: object
      properties:
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BillStatus'

    # ==================== PAYMENT SCHEMAS ====================
    Payment:
      type: object
      properties:
        id:
          type: string
        billId:
          type: string
        amount:
          type: number
        paymentDate:
          type: string
          format: date-time
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionId:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePaymentDto:
      type: object
      required: [billId, amount, paymentMethod]
      properties:
        billId:
          type: string
        amount:
          type: number
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        transactionId:
          type: string
        notes:
          type: string

  # ==================== ERROR RESPONSES ====================
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: "Bad Request"
            error: "Validation failed"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: "Unauthorized"
            error: "Invalid or expired token"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            message: "Forbidden"
            error: "Insufficient permissions"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: "Not Found"
            error: "Resource not found"

security:
  - bearerAuth: []

paths:
  # ==================== AUTHENTICATION ====================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role, firstName, lastName, phone, dateOfBirth, occupation, workplace]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)'
                role:
                  $ref: '#/components/schemas/UserRole'
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                avatar:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                occupation:
                  type: string
                workplace:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "User registered successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                message: "Conflict"
                error: "Email already exists"

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Token refreshed successfully"
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== USERS ====================
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDto'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Profile updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Change user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== BUILDINGS ====================
  /buildings:
    get:
      tags: [Buildings]
      summary: List buildings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: landlordId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Buildings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Buildings]
      summary: Create building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingDto'
      responses:
        '201':
          description: Building created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Building created successfully"
                  data:
                    $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /buildings/{id}:
    get:
      tags: [Buildings]
      summary: Get building details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Buildings]
      summary: Update building
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingDto'
      responses:
        '200':
          description: Building updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Building updated successfully"
                  data:
                    $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Buildings]
      summary: Delete building
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Building deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== ROOMS ====================
  /rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: buildingId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RoomStatus'
      responses:
        '200':
          description: Rooms retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Rooms]
      summary: Create room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomDto'
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Room created successfully"
                  data:
                    $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rooms/{id}:
    get:
      tags: [Rooms]
      summary: Get room details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Rooms]
      summary: Update room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomDto'
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Room updated successfully"
                  data:
                    $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Rooms]
      summary: Delete room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Room deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== RENTALS ====================
  /rentals:
    get:
      tags: [Rentals]
      summary: List rentals
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: roomId
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RentalStatus'
      responses:
        '200':
          description: Rentals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Success"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rental'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Rentals]
      summary: Create rental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalDto'
      responses:
        '201':
          description: Rental created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Rental created successfully"
                  data:
                    $ref: '#/components/schemas/Rental'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rentals/{id}:
    get:
      tags: [Rentals]
      summary: Get rental details
      parameters:
        - name: id
          in: path
