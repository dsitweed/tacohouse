name: Intlayer Test
# Fail the pull request when required locales are missing translations.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: intlayer-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ⚙️ Build dictionaries
        run: pnpm exec intlayer build
      - name: 🧪 Test for missing translations
        run: pnpm exec intlayer test
