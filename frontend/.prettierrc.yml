plugins:
  - '@trivago/prettier-plugin-sort-imports'
singleQuote: true
semi: true
bracketSpacing: true
trailingComma: all
importOrder:
  - '^@nestjs'
  - '<THIRD_PARTY_MODULES>'
  - '^@app/(.*)$'
  - '^@modules/(.*)$'
  - '^@common/(.*)$'
  - '^[./]'
importOrderSeparation: true
importOrderSortSpecifiers: true
importOrderParserPlugins:
  - 'typescript'
  - 'jsx'
  - 'decorators-legacy'
